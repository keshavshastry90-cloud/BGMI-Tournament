        extend: {

            bgmiGold: '#F59E0B',

    .team-badge-wrap svg {

</head>

        <span>Teams: <span id="showingCount" class="text-white text-sm font-bold">12</span> / 12</span>
        <span class="w-1 h-1 rounded-full bg-slate-600"></span>
        <span>Players: <span class="text-white text-sm font-bold">48</span> (4 / Squad)</span>
      </div>

                  <div class="flex items-center justify-between px-3 py-2.5 rounded-lg bg-bgmiDark border border-bgmiBorder/70 text-sm">
                    <div class="flex items-center gap-3">
                      <span class="font-mono text-xs text-slate-500 font-bold w-4">0${pIdx + 1}</span>
                      <svg class="w-3.5 h-3.5 text-slate-400" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                      </svg>
                      <span class="text-slate-200 font-medium tracking-wide">
                        ${playerName}
                      </span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Real-time search handler
    searchInput.addEventListener('input', (e) => {
      currentQuery = e.target.value;
      renderTeams();
    });

    window.onload = function() {
      renderTeams();
    };
  </script>
</body>
</html>
